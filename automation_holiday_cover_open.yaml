id: holiday_cover_open
alias: "Holiday: Open Tapparella Sala Finestra"
description: "Opens cover.tapparella_sala_finestra at 10:00. Enable when on holiday."
trigger:
  - platform: time
    at: "10:00:00"
condition: []
action:
  - action: cover.open_cover
    target:
      entity_id: cover.tapparella_sala_finestra
mode: single
